# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Snyk Token
        id: check_token
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::SNYK_TOKEN is not configured in repository secrets. Skipping Snyk scan. To enable Snyk, add SNYK_TOKEN in Settings -> Secrets and variables -> Actions."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: npm ci

      - name: Set up Snyk CLI
        if: steps.check_token.outputs.has_token == 'true'
        uses: snyk/actions/setup@v0.4.0

      - name: Snyk Code (SAST) Test
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          snyk code test --sarif-file-output=snyk-code.sarif || true

      - name: Snyk Open Source (SCA) Test
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          snyk test --sarif-file-output=snyk-sca.sarif || true

      - name: Upload Snyk Code SARIF to GitHub Code Scanning
        if: steps.check_token.outputs.has_token == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk SCA SARIF to GitHub Code Scanning
        if: steps.check_token.outputs.has_token == 'true' && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca
