app-id: io.github.medscript.MedScriptOPD
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: medscript-opd

finish-args:
  # Network access for local server and optional LAN clinic tablet access
  - --share=network
  - --share=ipc
  # Display servers
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=x11
  # Portal access for file open/save dialogs (PDF printouts, CSV exports, DB backups)
  - --talk-name=org.freedesktop.portal.Desktop
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create

build-options:
  append-path: /usr/lib/sdk/node20/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: medscript-opd
    buildsystem: simple
    build-commands:
      # Install app directory in /app/lib/medscript-opd
      - mkdir -p /app/lib/medscript-opd
      - cp -r * /app/lib/medscript-opd/
      - cd /app/lib/medscript-opd && npm install --omit=dev
      - cd /app/lib/medscript-opd && npm run build

      # Install launcher binary
      - install -Dm755 packaging/flatpak/medscript-opd-runner.sh /app/bin/medscript-opd

      # Install Freedesktop desktop file, AppStream metainfo, and icon
      - install -Dm644 packaging/flatpak/io.github.medscript.MedScriptOPD.desktop /app/share/applications/io.github.medscript.MedScriptOPD.desktop
      - install -Dm644 packaging/flatpak/io.github.medscript.MedScriptOPD.metainfo.xml /app/share/metainfo/io.github.medscript.MedScriptOPD.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.medscript.MedScriptOPD.svg /app/share/icons/hicolor/scalable/apps/io.github.medscript.MedScriptOPD.svg

    sources:
      - type: dir
        path: ../../
