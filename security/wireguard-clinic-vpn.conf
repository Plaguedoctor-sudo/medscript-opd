# ==============================================================================
# MedScript-OPD: WireGuard Secure Clinical VPN Tunnel Configuration
# ==============================================================================
# Compliance Standard: HIPAA Security Rule § 164.312(e)(1) Transmission Security
# Purpose: Allows the doctor to securely connect their laptop or tablet from home
#          or hospital directly to the clinic workstation over a peer-to-peer,
#          state-of-the-art ChaCha20-Poly1305 encrypted WireGuard VPN tunnel
#          WITHOUT opening any public router ports to the internet.
# ==============================================================================

# ------------------------------------------------------------------------------
# SECTION 1: CLINIC WORKSTATION / OPD SERVER (wg0.conf)
# Location: /etc/wireguard/wg0.conf on the clinic workstation
# ------------------------------------------------------------------------------
[Interface]
# Private IP assigned to the clinic workstation inside the secure VPN mesh
Address = 10.100.0.1/24
ListenPort = 51820
PrivateKey = <CLINIC_SERVER_PRIVATE_KEY_HERE>

# Optional firewall automation on tunnel start/stop
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Peer 1: Doctor's Mobile / Laptop Workstation
[Peer]
PublicKey = <DOCTOR_LAPTOP_PUBLIC_KEY_HERE>
AllowedIPs = 10.100.0.2/32

# Peer 2: Doctor's Tablet / Mobile Phone (Optional)
# [Peer]
# PublicKey = <DOCTOR_TABLET_PUBLIC_KEY_HERE>
# AllowedIPs = 10.100.0.3/32


# ------------------------------------------------------------------------------
# SECTION 2: DOCTOR'S REMOTE CLIENT DEVICE (doctor-client.conf)
# Load this file into the official WireGuard App on Windows, macOS, Android, or iOS
# ------------------------------------------------------------------------------
# [Interface]
# Address = 10.100.0.2/24
# PrivateKey = <DOCTOR_LAPTOP_PRIVATE_KEY_HERE>
# DNS = 1.1.1.1
#
# [Peer]
# PublicKey = <CLINIC_SERVER_PUBLIC_KEY_HERE>
# Endpoint = clinic-static-ip.example.com:51820
# AllowedIPs = 10.100.0.0/24
# PersistentKeepalive = 25
#
# Once connected, the doctor accesses MedScript-OPD securely in their browser via:
# https://10.100.0.1:3000 (or via reverse proxy on port 443)


# ------------------------------------------------------------------------------
# ALTERNATIVE: ZERO-CONFIG TAILSCALE / HEADSCALE OVERLAY MESH
# ------------------------------------------------------------------------------
# If the clinic has dynamic IP or CGNAT (Carrier-Grade NAT) without port forwarding,
# Tailscale (built on WireGuard) provides zero-config encrypted peer-to-peer access:
#
# 1. Install Tailscale on Clinic PC:
#    curl -fsSL https://tailscale.com/install.sh | sh
#    sudo tailscale up
#
# 2. Install Tailscale on Doctor's remote laptop/phone and log into the same account.
#
# 3. Access MedScript-OPD directly over the encrypted mesh:
#    http://<clinic-tailscale-magic-dns-name>:3000
