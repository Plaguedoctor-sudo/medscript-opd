# ==============================================================================
# MedScript-OPD: Enterprise Nginx TLS 1.3 Reverse Proxy Configuration
# ==============================================================================
# Standards: NIST SP 800-52r2 (Guidelines for TLS) / HIPAA / NABH Digital Health
# ==============================================================================

# Rate Limiting Zone: Restrict burst attempts to 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=medscript_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=medscript_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name clinic.local opd.yourclinic.com;

    # Force immediate redirect of all unencrypted HTTP traffic to HTTPS TLS 1.3
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.local opd.yourclinic.com;

    # TLS Certificates (Configure paths to your clinical SSL certificates)
    ssl_certificate /etc/ssl/certs/medscript.crt;
    ssl_certificate_key /etc/ssl/private/medscript.key;

    # Modern Cryptographic Protocols (TLS 1.2 & TLS 1.3 Only, deprecating SSLv3, TLS 1.0, 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # SSL Session Caching for Low Latency
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client Request Body Limits (Max 10MB for clinic letterhead images & PDF exports)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Buffer Overflow & Slowloris Attack Mitigations
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # High-Security Response Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Remove server identity signatures
    server_tokens off;

    # Reverse Proxy to MedScript-OPD Next.js Server
    location / {
        limit_req zone=medscript_limit burst=50 nodelay;
        limit_conn medscript_conn 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable disk caching of clinical responses on proxy
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Access and Error Logging
    access_log /var/log/nginx/medscript-access.log;
    error_log /var/log/nginx/medscript-error.log warn;
}
